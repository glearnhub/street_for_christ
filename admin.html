<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Street for Christ" />
    <meta property="og:title" content="Administrator login · Street for Christ" />
    <meta property="og:description" content="Event registration and check-in for Street for Christ." />
    <meta property="og:image" content="https://streetforchrist.vercel.app/img/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://streetforchrist.vercel.app/img/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Street for Christ logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Administrator login · Street for Christ" />
    <meta name="twitter:description" content="Event registration and check-in for Street for Christ." />
    <meta name="twitter:image" content="https://streetforchrist.vercel.app/img/og-image.jpg" />
    <meta name="robots" content="noindex" />
    <title>Administrator login · Street for Christ</title>
    <link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="admin">
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-logo">
          <img src="img/logo.png" alt="Street for Christ" width="1100" height="644" />
          <p class="muted" style="margin:.25rem 0 0">Administrator login</p>
        </div>
        <div id="status" aria-live="polite"></div>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button id="login-btn" class="btn btn-primary" type="submit" style="width:100%">Sign in</button>
        </form>
        <p class="muted" style="margin:1rem 0 0;font-size:.85rem">
          Administrator accounts are created by the site owner. <a href="/">Back to the public site</a>
        </p>
      </div>
    </div>
    <script type="module">
      import { initLogin } from './js/admin-auth.js'
      initLogin()
    </script>
  </body>
</html>
